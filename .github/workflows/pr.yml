name: PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install app
        run: npm ci

      - name: Install a11y tools
        run: npm ci
        working-directory: a11y-audits/tools

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: a11y-audits/tools

      - name: Shrink-only axe baseline
        run: npm run a11y:ci
        working-directory: a11y-audits/tools
        env:
          CI: '1'
