<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examples — Activity preview</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root {
      --ex-border: #c8cdd9;
      --ex-bg: #f4f5f9;
      --ex-panel: #fff;
      --ex-text: #11192e;
      --ex-muted: #66718f;
      --ex-accent: #377dff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ex-border: #2d3855;
        --ex-bg: #11192e;
        --ex-panel: #1d2740;
        --ex-text: #edeff5;
        --ex-muted: #979fb4;
        --ex-accent: #4888ff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-columns: minmax(260px, 340px) 1fr;
      grid-template-rows: 1fr;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 14px;
      color: var(--ex-text);
      background: var(--ex-bg);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--ex-border);
      background: var(--ex-panel);
      min-height: 0;
    }
    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--ex-border);
      flex-shrink: 0;
    }
    .sidebar-header h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .sidebar-header p {
      margin: 0;
      font-size: 12px;
      color: var(--ex-muted);
      line-height: 1.35;
    }
    #filter {
      width: 100%;
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid var(--ex-border);
      border-radius: 8px;
      font: inherit;
      color: inherit;
      background: var(--ex-bg);
    }
    #list {
      list-style: none;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    #list li { margin: 0 0 4px; }
    #list button {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      line-height: 1.3;
    }
    #list button:hover {
      background: var(--ex-bg);
      border-color: var(--ex-border);
    }
    #list button.active {
      border-color: var(--ex-accent);
      background: var(--ex-bg);
      font-weight: 600;
    }
    #list button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    .preview {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .preview-toolbar {
      flex-shrink: 0;
      padding: 8px 12px;
      border-bottom: 1px solid var(--ex-border);
      background: var(--ex-panel);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .preview-toolbar span {
      font-size: 12px;
      color: var(--ex-muted);
    }
    .preview-toolbar button {
      padding: 6px 12px;
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--ex-border);
      background: var(--ex-bg);
      color: inherit;
      cursor: pointer;
    }
    .preview-toolbar button:hover { border-color: var(--ex-accent); }
    #grade-btn {
      background: var(--ex-accent);
      color: #fff;
      border-color: var(--ex-accent);
      font-weight: 600;
    }
    #grade-btn:hover { opacity: 0.9; }
    #grade-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--ex-panel);
      border-radius: 12px;
      width: min(700px, 92vw);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--ex-border);
      flex-shrink: 0;
    }
    .modal-header h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--ex-muted);
      padding: 2px 6px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--ex-text); }
    .modal-body {
      overflow-y: auto;
      padding: 18px;
      flex: 1;
      min-height: 0;
    }
    .score-summary {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .score-card {
      flex: 1;
      min-width: 100px;
      padding: 14px 16px;
      background: var(--ex-bg);
      border-radius: 8px;
      text-align: center;
    }
    .score-card .value {
      font-size: 28px;
      font-weight: 700;
      color: var(--ex-accent);
      margin-bottom: 4px;
    }
    .score-card .label {
      font-size: 12px;
      color: var(--ex-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .breakout-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }
    .breakout-table th,
    .breakout-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--ex-border);
      font-size: 13px;
    }
    .breakout-table th {
      font-weight: 600;
      color: var(--ex-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .breakout-table .score-col { text-align: center; width: 80px; }
    .breakout-table .correct { color: #2e7d32; }
    .breakout-table .incorrect { color: #c62828; }
    .report-section {
      margin-top: 16px;
      border-top: 1px solid var(--ex-border);
      padding-top: 12px;
    }
    .report-section summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: var(--ex-muted);
      user-select: none;
    }
    .report-section pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.5;
      margin: 8px 0 0;
      padding: 12px;
      background: var(--ex-bg);
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }
    #frame-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #app-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    @media (max-width: 720px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(200px, 40vh) 1fr;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Example activities</h1>
      <p>Pick a file from <code>data/examples</code>. It is copied to <code>data/question.md</code> and the preview reloads.</p>
      <input type="search" id="filter" placeholder="Filter by name…" autocomplete="off" />
    </div>
    <ul id="list" aria-label="Example markdown files"></ul>
  </aside>
  <div class="preview">
    <div class="preview-toolbar">
      <button type="button" id="reload" title="Reload preview without changing example">Reload preview</button>
      <button type="button" id="grade-btn" title="Show grading results">Grade</button>
      <span id="status"></span>
    </div>
    <div class="modal-backdrop" id="grade-modal">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-title">Results</h2>
          <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
    <div id="frame-wrap">
      <iframe id="app-frame" title="Activity preview" src="/play" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </div>
  <script>
    (function () {
      const listEl = document.getElementById('list');
      const filterEl = document.getElementById('filter');
      const frame = document.getElementById('app-frame');
      const statusEl = document.getElementById('status');
      const reloadBtn = document.getElementById('reload');
      const gradeBtn = document.getElementById('grade-btn');
      const modal = document.getElementById('grade-modal');
      const modalBody = document.getElementById('modal-body');
      const modalClose = document.getElementById('modal-close');
      const modalTitle = document.getElementById('modal-title');
      let examples = [];
      let activeFilename = null;

      function isAssessmentExample(filename) {
        return filename && /^assessment-/i.test(filename) && !/-answer-key\.md$/i.test(filename);
      }

      function setStatus(msg, isError) {
        statusEl.textContent = msg || '';
        statusEl.style.color = isError ? '#c62828' : '';
      }

      function renderList() {
        const q = (filterEl.value || '').trim().toLowerCase();
        listEl.innerHTML = '';
        examples
          .filter((name) => !q || name.toLowerCase().includes(q))
          .forEach((filename) => {
            const li = document.createElement('li');
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = filename;
            if (filename === activeFilename) btn.classList.add('active');
            btn.addEventListener('click', () => selectExample(filename, btn));
            li.appendChild(btn);
            listEl.appendChild(li);
          });
      }

      function refreshFrame() {
        frame.src = '/play?cb=' + Date.now();
      }

      async function selectExample(filename, btn) {
        if (btn) btn.disabled = true;
        setStatus('Applying…');
        try {
          const res = await fetch('/api/examples/select', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setStatus(data.error || res.statusText, true);
            return;
          }
          activeFilename = filename;
          listEl.querySelectorAll('button').forEach((b) => {
            b.classList.toggle('active', b.textContent === filename);
          });
          setStatus('Loaded: ' + filename);
          refreshFrame();
        } catch (e) {
          setStatus(String(e.message || e), true);
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      // Grading
      function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      function renderModal(data) {
        const { score, report } = data;
        let html = '';

        if (score) {
          const pct = score.maxScore > 0
            ? Math.round((score.totalScore / score.maxScore) * 100)
            : 0;
          html += '<div class="score-summary">';
          html += `<div class="score-card"><div class="value">${score.totalScore} / ${score.maxScore}</div><div class="label">Score</div></div>`;
          html += `<div class="score-card"><div class="value">${pct}%</div><div class="label">Percentage</div></div>`;
          html += '</div>';

          if (score.breakoutScores && score.breakoutScores.length > 0) {
            html += '<table class="breakout-table"><thead><tr><th>Item</th><th class="score-col">Score</th></tr></thead><tbody>';
            score.breakoutScores.forEach((b) => {
              const cls = b.score === b.maxScore ? 'correct' : 'incorrect';
              html += `<tr><td>${escapeHtml(b.title)}</td><td class="score-col ${cls}">${b.score} / ${b.maxScore}</td></tr>`;
            });
            html += '</tbody></table>';
          }
        }

        if (report) {
          html += '<details class="report-section"><summary>Full Report (report.md)</summary>';
          html += `<pre>${escapeHtml(report)}</pre>`;
          html += '</details>';
        }

        modalBody.innerHTML = html;
        modal.classList.add('open');
      }

      function closeModal() {
        modal.classList.remove('open');
      }

      modalClose.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
      });

      gradeBtn.addEventListener('click', async () => {
        gradeBtn.disabled = true;
        setStatus('Grading…');
        try {
          let res, data;
          if (isAssessmentExample(activeFilename)) {
            // Assessment mode: run generate-score.js via the server
            res = await fetch('/api/examples/grade', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ filename: activeFilename })
            });
          } else {
            // Classic mode: read the auto-generated score.json and report.md
            res = await fetch('/api/examples/results');
          }
          data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setStatus(data.error || 'Grading failed', true);
            return;
          }
          setStatus('Graded: ' + (activeFilename || 'current activity'));
          modalTitle.textContent = isAssessmentExample(activeFilename) ? 'Assessment Results' : 'Results';
          renderModal(data);
        } catch (e) {
          setStatus('Grading error: ' + e.message, true);
        } finally {
          gradeBtn.disabled = false;
        }
      });

      filterEl.addEventListener('input', renderList);
      reloadBtn.addEventListener('click', () => {
        setStatus('Reloading…');
        refreshFrame();
        setTimeout(() => setStatus(activeFilename ? 'Loaded: ' + activeFilename : ''), 400);
      });

      frame.addEventListener('load', () => {
        if (activeFilename) setStatus('Loaded: ' + activeFilename);
      });

      fetch('/api/examples/list')
        .then((r) => r.json())
        .then((data) => {
          examples = Array.isArray(data.examples) ? data.examples.slice() : [];
          examples.sort((a, b) => a.localeCompare(b));
          renderList();
          setStatus(examples.length + ' examples');
        })
        .catch((e) => setStatus('Failed to load list: ' + e.message, true));
    })();
  </script>
</body>
</html>
